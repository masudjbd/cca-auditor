[package]
name = "cca-audit"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auditor-core = { path = "../../../crates/auditor-core" }
auditor-db = { path = "../../../crates/auditor-db" }
auditor-detect = { path = "../../../crates/auditor-detect" }
auditor-monitors = { path = "../../../crates/auditor-monitors" }
auditor-fs = { path = "../../../crates/auditor-fs" }
auditor-ipc = { path = "../../../crates/auditor-ipc" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
dirs = "5"
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
