# AI tool fingerprints for CCAudit process detection
# Each [[tool]] stanza defines how to identify a running tool process

[[tool]]
id = "cursor"
kind = "editor"
display_name = "Cursor"
exe_name = ["Cursor", "cursor"]
exe_path_contains = ["/Cursor.app/Contents/MacOS/", "/opt/cursor", "C:\\Program Files\\Cursor"]
cmd_contains = []
include_descendants = true

[[tool]]
id = "claude-code"
kind = "cli-agent"
display_name = "Claude Code"
exe_name = ["claude", "claude-code"]
exe_path_contains = [".cargo/bin/claude"]
cmd_contains = ["@anthropic-ai/claude-code"]
include_descendants = true

[[tool]]
id = "claude-desktop"
kind = "cli-agent"
display_name = "Claude Desktop"
exe_name = ["Claude"]
exe_path_contains = ["/Applications/Claude.app/", "C:\\Program Files\\Claude"]
cmd_contains = []
include_descendants = false

